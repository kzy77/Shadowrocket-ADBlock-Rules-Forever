# ============================================================
# custom_extra.conf —— 自定义「功能性段落」片段（唯一维护点）
#
# 用于 [Rule] 之外的段落：[Host]、[URL Rewrite]、[MITM]。
# 运行 `python3 merge_plus.py` 后会被合并进 lazy_group_plus.conf：
#   [Proxy Group] —— 追加到 [Proxy Group] 段末尾（自定义分组）
#   [Host]        —— 追加到 [Host] 段末尾
#   [URL Rewrite] —— 追加到 [URL Rewrite] 段末尾
#   [MITM]        —— hostname 列表与模板合并（去重，不覆盖模板原有主机名）
# ============================================================

# ---- Host：TestFlight 走 8.8.4.4 解析 ----
[Host]
*testflight.apple.com = server:8.8.4.4

# ---- URL Rewrite：YouTube 去广告 ----
# 注意：需在 Shadowrocket 中开启 HTTPS 解密并信任证书，[MITM] 已由下方合并
[URL Rewrite]
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad - reject

# ---- MITM：主机名与模板 *.google.cn 合并 ----
[MITM]
hostname = *.googlevideo.com
