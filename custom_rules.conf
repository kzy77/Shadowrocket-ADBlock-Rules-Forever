# ============================================================
# custom_rules.conf —— 自定义规则片段（唯一维护点）
#
# 用法：在本文件追加规则，然后运行 `python3 merge_plus.py` 重新生成
# lazy_group_plus.conf。本文件内容会被注入到 [Rule] 区最顶部，
# 自上而下匹配、先命中先生效，因此这里的规则覆盖上游同域名配置。
#
# 注意：ByteDance.list 含一条 USER-AGENT,TikTok* 规则会把 TikTok App
# 的 HTTP 请求抢到直连，因此下方紧跟一条 USER-AGENT 规则覆盖回 TIKTOK
# 分组（网页版无此 UA，本来就走 TIKTOK 分组，不受影响）。
# ============================================================

# ---- 字节系全部直连 ----
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ByteDance/ByteDance.list,DIRECT

# ---- TikTok App 走代理（覆盖上面 ByteDance.list 中的 USER-AGENT,TikTok* 直连）----
USER-AGENT,TikTok*,TIKTOK
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/TikTok/TikTok.list,TIKTOK
