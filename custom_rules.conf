# ============================================================
# custom_rules.conf —— 自定义规则片段（唯一维护点）
#
# 用法：在本文件追加规则，然后运行 `python3 merge_plus.py` 重新生成
# lazy_group_plus.conf。本文件内容会被注入到 [Rule] 区最顶部，
# 自上而下匹配、先命中先生效，因此这里的规则覆盖上游同域名配置。
#
# 注意：ByteDance.list 含一条 USER-AGENT,TikTok* 规则，TikTok App 的
# HTTP 请求会被强制直连（网页版不受影响，仍走 TIKTOK 分组）。如需
# TikTok App 走代理，可在下方补充
# `USER-AGENT,TikTok*,TIKTOK`（放在字节直连之后即可覆盖回代理）。
# ============================================================

# ---- 字节系全部直连 ----
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ByteDance/ByteDance.list,DIRECT
