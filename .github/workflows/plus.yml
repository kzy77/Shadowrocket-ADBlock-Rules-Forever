name: Build lazy_group_plus (manual)

# push / 定时构建已并入 release.yml（推送 release 分支即自动重建 lazy_group_plus.conf）。
# 此工作流只保留手动入口：Actions 页面选择本工作流 Run workflow，立即按仓库内现有文件重建一次。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge custom rules and sections
        run: python3 merge_plus.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain lazy_group_plus.conf)" ]; then
            echo "lazy_group_plus.conf 无变化，跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lazy_group_plus.conf
          git commit -m "chore: 自动生成 lazy_group_plus.conf [skip ci]"
          git push
